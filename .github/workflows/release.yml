name: Release

# 推 v* 标签 → 自动打包成签名 APK 并挂到 GitHub Release 上。
# 手动触发时在 inputs.tag 里填要发布的标签（例如 v1.4.0）。
#
# 签名密钥不放仓库里，走 GitHub Actions secrets：
#   先在本机跑一次 app/setup-release-secrets.ps1 把签名信息传上去。
# 这样 CI 打出来的包和本机 build-apk.ps1 -Release 出来的包【同一个签名】，
# 用户从 Release 下载的包可以直接覆盖安装本机装过的版本。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的标签，例如 v1.4.0'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 确定发布标签
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF_NAME}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "发布标签：$TAG"

      - name: 校验标签与版本号一致
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          PKG=$(node -p "require('./app/package.json').version")
          GRADLE=$(grep -oE 'versionName\s+"[^"]+"' app/android/app/build.gradle | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [ "$TAG" != "v$PKG" ]; then
            echo "::error::标签 $TAG 与 app/package.json 的版本 v$PKG 对不上"
            exit 1
          fi
          if [ "$GRADLE" != "$PKG" ]; then
            echo "::error::app/android/app/build.gradle 的 versionName 是 $GRADLE，与 package.json 的 $PKG 对不上"
            exit 1
          fi
          echo "版本一致：$PKG"

      - name: 还原签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          MISSING=""
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then MISSING="$MISSING $v"; fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::缺少 GitHub secret：$MISSING"
            echo "::error::在本机跑 app/setup-release-secrets.ps1 上传签名信息后再发布"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/android/tomato-release.keystore
          cat > app/android/keystore.properties <<EOF
          storeFile=tomato-release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          cat > app/android/local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          EOF
          ls -la app/android/tomato-release.keystore app/android/keystore.properties

      - name: 安装依赖
        working-directory: app
        run: npm ci

      - name: Capacitor sync（把 www/ 拷进安卓工程）
        working-directory: app
        run: npx cap sync android

      - name: 打包 release APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 确认产物已签名
        id: apk
        run: |
          set -euo pipefail
          DIR=app/android/app/build/outputs/apk/release
          APK=""
          for f in "$DIR"/*.apk; do
            case "$f" in *unsigned*) continue;; esac
            APK="$f"
          done
          if [ -z "$APK" ]; then
            echo "::error::没有找到已签名的 APK（签名配置没生效？）"
            ls -la "$DIR" || true
            exit 1
          fi
          echo "产物：$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -la "$DIR"

      - name: 上传为工作流产物
        uses: actions/upload-artifact@v4
        with:
          name: tomato-clock-${{ steps.tag.outputs.tag }}-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: 发布到 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          cp "${{ steps.apk.outputs.path }}" "tomato-clock-$TAG.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "tomato-clock-$TAG.apk" --clobber
            echo "已覆盖 Release $TAG 里的 APK"
          else
            gh release create "$TAG" "tomato-clock-$TAG.apk" \
              --title "番茄钟 $TAG" \
              --generate-notes
            echo "已创建 Release $TAG"
          fi
